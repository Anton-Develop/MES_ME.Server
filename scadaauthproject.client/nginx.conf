events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ⬇️ ДОБАВЬТЕ глобальные настройки для больших файлов
  client_max_body_size 100M;
  client_body_timeout 600s;
  client_header_timeout 600s;
  send_timeout 600s;

  server {
    listen       80;
    server_name  localhost;
	# Корень, куда отдаются статические файлы React
    root   /usr/share/nginx/html;
    index  index.html;
	# Обработка маршрутов React Router (если используется)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к API на бэкенд
    location /api {
         proxy_pass http://backend-mesmeserver-1:80;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         
         # ⬇️ ДОБАВЬТЕ настройки таймаутов для проксирования
         proxy_connect_timeout 600s;
         proxy_send_timeout 600s;
         proxy_read_timeout 600s;
         
         # ⬇️ ВАЖНО: отключаем буферизацию для больших файлов
         proxy_request_buffering off;
         proxy_buffering off;
    }
  }
}